comment: "ENCODE icSHAPE, K562. GEO splits this experiment across two series: GSE143120 holds the NAI-N3 samples (used as raw_data.accession) and GSE143096 holds the matched DMSO controls, which are included here as the untreated runs. Do NOT expand GSE143120 via its SRA project - it resolves to the whole ENCODE BioProject (57k runs); fetch the listed GSMs directly. The DOI is the ENCODE flagship paper, which is what GEO links; replace it if an icSHAPE-specific citation exists. RT_enzyme and rna_type follow the standard icSHAPE protocol."
