comment: "Paywalled paper: only the transcriptome-wide fSHAPE arm is included (3 cell lines, in-cell and deproteinised in vitro, 2 replicates each). The SHAPE-eCLIP / fSHAPE-eCLIP IP+Input libraries in GSE149767 are excluded - they are protein-footprint pulldowns, not a plain structurome. The untreated pair per cell line is filed under the in_vivo group. RT_enzyme and rna_type follow the standard SHAPE-MaP protocol - confirm."
