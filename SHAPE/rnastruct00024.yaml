  # Three transcript pools probed separately: the full 11-segment transcriptome and segment-specific pools of segments 5+6 and 10+11. Each pool is its own experiment, so each pool and NSP2 concentration is its own sample_group; each pool's DMSO control pairs with its NSP2 groups by the shared group prefix.
  # 5/10/20uM labels indicate NSP2 concentration; NSP2 is rotavirus non-structural protein 2, an RNA chaperone involved in genome packaging.
  # SRA holds one repeat per pool and concentration; the paper's supplement shows two, but repeat 2 was not deposited.
  # The authors' segment 3 ("SA3" in their supplement) is only 78% identical to RF segment 3, so the in vitro transcriptome used another strain's segment 3; an RF reference maps few of its reads.
