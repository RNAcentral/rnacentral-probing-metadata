comment: "Only the icSHAPE / FracSHAPE / FracSHAPE-ATPdep probing runs are included; the SPLASH proximity-ligation, RNA-seq and Ribo-seq libraries in GSE288910 are excluded. The InvitroRefolded groups are the in_vitro arm, everything else is in-cell. The six U-2 OS runs are dropped - one replicate per group. The DOI is a preprint placeholder: GSE288910 had no linked publication at curation time - replace it once the paper is out, and confirm RT_enzyme / rna_type against its methods."
