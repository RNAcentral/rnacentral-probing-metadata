dataset_id: # Required # Unique dataset identifier. Next consecutive number across SHAPE/ and DMS/. e.g. rnastruct00065
schema_version: "1.0.0" # Do not edit this

organism:
  scientific_name: # Required # Latin binomial for non-viral organisms (e.g. Homo sapiens). For viral datasets use the common name from NCBI Taxonomy (e.g. SARS-CoV-2, Influenza A virus).
  ncbi_taxid: # Required # NCBI Taxonomy ID as a plain integer. e.g. 9606
  strain: # Required for viral datasets only # Strain name as reported in the paper. e.g. A/Puerto Rico/8/1934(H1N1)

experiment:
  method: # Required # Name of the probing protocol. e.g. SHAPE-MaP, icSHAPE, DMS-MaPseq, DMS-seq, NAI-MaP, Structure-seq2
  principle: # Required # Reverse transcription approach. One of: RT-stop, MaP
  obi: # Optional # OBI ontology term for the probing chemistry. SHAPE reagents: OBI:0003886. DMS: OBI:0001015. icSHAPE (NAI-N3): OBI:0003887
  chemical: # Required # Chemical probe used. One of: DMS, 1M7, NAI, NAI-N3, 2A3, I5, 1M4, 6A3, B5, NIC, BzCN, 1M6, NMIA, 5NIA
  RT_enzyme: # Required # Reverse transcriptase enzyme used. One of: M-MLV, Group II intron
  context: # Required # Probing context(s) as a list. One or more of: in_vivo, in_vitro, ex_vivo, in_virio, ex_virio, denatured. e.g. [in_vivo]
  rna_type: # Optional # RNA fraction captured. One of: mRNA (oligo-dT selected), total (total or rRNA-depleted), sRNA (small RNA <200 nt)
  pH: # Optional # Reaction pH as a number. e.g. 7.4
  adapter_3p: # Optional # 3′ adapter sequence to trim. e.g. GGAAGAGCACACGTCTGAACTCCAGTCAC
  adapter_5p: # Optional # 5′ adapter sequence to trim.
  umi_pattern: # Optional # UMI pattern e.g. NNNNNNNNN

publication:
  doi: # Required # DOI without the https://doi.org/ prefix. e.g. 10.1038/s41586-020-2522-3
  year: # Required # Year of publication. e.g. 2021

raw_data:
  repository: # Required # Repository where raw reads are deposited. One of: GEO, SRA, ENA, DDBJ
  accession: # Required # Top-level study or series accession. e.g. GSE145805, PRJNA123456
  landing_page: # Optional # URL to the repository landing page. e.g. https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE145805
  run_accessions:
  - accession: # Required # Run or sample accession supported by nf-core/fetchngs. e.g. GSM1234567, SRR1234567, ERR1234567
    sample_name: # Required # Short descriptive name encoding the key biological variables. e.g. HeLa_in_vivo_treated_r1
    sample_group: # Required # Grouping label; samples sharing this value are analysed together. No whitespace — use underscores. e.g. HeLa_in_vivo
    condition: # Required # One of: treated, untreated, denatured
    replicate: # Required # Biological replicate number (integer starting at 1). e.g. 1
  - accession:
    sample_name:
    sample_group:
    condition:
    replicate:

comment: null # Set to null for pipeline processing.
