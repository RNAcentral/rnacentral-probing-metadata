<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="1190" viewBox="0 0 1190 1190" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <style>
      .title    { font-size: 26px; font-weight: 700; fill: #1b2430; }
      .subtitle { font-size: 14px; fill: #5b6472; }
      .step     { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .head     { font-size: 17px; font-weight: 700; fill: #1b2430; }
      .body     { font-size: 13px; fill: #37414f; }
      .edge     { font-size: 12px; fill: #5b6472; font-style: italic; }
      .num      { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .legend   { font-size: 12.5px; fill: #37414f; }
    </style>
  </defs>

  <rect width="960" height="1180" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="52" class="title">Chemical-probing dataset → YAML pipeline</text>
  <text x="40" y="76" class="subtitle">Finding RNA structure-probing papers on Europe PMC and turning them into RNAcentral metadata</text>

  <!-- ================= STAGE 1 ================= -->
  <g>
    <rect x="230" y="110" width="500" height="86" rx="12" fill="#e8f0fe" stroke="#4a80e0" stroke-width="1.5"/>
    <circle cx="262" cy="140" r="15" fill="#4a80e0"/><text x="262" y="145" text-anchor="middle" class="num">1</text>
    <text x="290" y="136" class="step" fill="#4a80e0">DISCOVER</text>
    <text x="290" y="160" class="head">europepmc-search skill → Europe PMC REST</text>
    <text x="290" y="182" class="body">ABSTRACT:"DMS-MaPseq" OR "SHAPE-MaP" OR "icSHAPE" …  ·  per year range 2022→2026</text>
  </g>
  <line x1="480" y1="196" x2="480" y2="228" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="218" class="edge">papers (DOI, title, year)</text>

  <!-- ================= STAGE 2 ================= -->
  <g>
    <rect x="230" y="230" width="500" height="104" rx="12" fill="#e8f0fe" stroke="#4a80e0" stroke-width="1.5"/>
    <circle cx="262" cy="260" r="15" fill="#4a80e0"/><text x="262" y="265" text-anchor="middle" class="num">2</text>
    <text x="290" y="256" class="step" fill="#4a80e0">TRIAGE</text>
    <text x="290" y="280" class="body">• drop DOIs already in DMS/ + SHAPE/</text>
    <text x="290" y="300" class="body">• open access?  (isOpenAccess = Y → full text readable)</text>
    <text x="290" y="320" class="body">• split accessible  vs  paywalled</text>
  </g>
  <!-- paywalled side branch -->
  <line x1="730" y1="282" x2="838" y2="282" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="770" y="230" width="170" height="104" rx="12" fill="#fdeaea" stroke="#d9534f" stroke-width="1.5"/>
    <text x="855" y="270" text-anchor="middle" class="step" fill="#d9534f">PAYWALLED</text>
    <text x="855" y="294" text-anchor="middle" class="body">flag for manual</text>
    <text x="855" y="312" text-anchor="middle" class="body">review (DOI list)</text>
  </g>
  <line x1="480" y1="334" x2="480" y2="366" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="356" class="edge">accessible candidates</text>

  <!-- ================= STAGE 3 ================= -->
  <g>
    <rect x="230" y="368" width="500" height="94" rx="12" fill="#e8f0fe" stroke="#4a80e0" stroke-width="1.5"/>
    <circle cx="262" cy="398" r="15" fill="#4a80e0"/><text x="262" y="403" text-anchor="middle" class="num">3</text>
    <text x="290" y="394" class="step" fill="#4a80e0">RESOLVE DATA</text>
    <text x="290" y="418" class="body">full-text XML → grep "Data availability" → study's OWN accession</text>
    <text x="290" y="440" class="body">reject re-used / cited accessions   ·   GSExxxxx / PRJNAxxxxx</text>
  </g>
  <line x1="480" y1="462" x2="480" y2="494" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="484" class="edge">accession</text>

  <!-- ================= STAGE 4 ================= -->
  <g>
    <rect x="230" y="496" width="500" height="94" rx="12" fill="#e8f0fe" stroke="#4a80e0" stroke-width="1.5"/>
    <circle cx="262" cy="526" r="15" fill="#4a80e0"/><text x="262" y="531" text-anchor="middle" class="num">4</text>
    <text x="290" y="522" class="step" fill="#4a80e0">EXPAND RUNS</text>
    <text x="290" y="546" class="body">expand_accession.py:  GEO → BioProject → ENA filereport</text>
    <text x="290" y="568" class="body">→ run accessions + sample titles  (e.g. "invivo DMS0.05 rep1" → SRR…)</text>
  </g>
  <line x1="480" y1="590" x2="480" y2="622" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="612" class="edge">runs + titles</text>

  <!-- ================= STAGE 5 (human) ================= -->
  <g>
    <rect x="230" y="624" width="500" height="112" rx="12" fill="#fff4e0" stroke="#e0952a" stroke-width="1.5"/>
    <circle cx="262" cy="654" r="15" fill="#e0952a"/><text x="262" y="659" text-anchor="middle" class="num">5</text>
    <text x="290" y="650" class="step" fill="#c47f1e">MAP FIELDS — human / model judgement</text>
    <text x="290" y="674" class="body">method · principle · RT_enzyme · chemical · rna_type · context</text>
    <text x="290" y="694" class="body">DMS0 / DMSO → condition: untreated    |    probe → treated</text>
    <text x="290" y="714" class="body">choose sample_group axis · replicate from title · next free rnastruct#####</text>
  </g>
  <line x1="480" y1="736" x2="480" y2="768" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="758" class="edge">fill docs/template.yaml</text>

  <!-- ================= STAGE 6 ================= -->
  <g>
    <rect x="230" y="770" width="500" height="86" rx="12" fill="#e6f4ea" stroke="#3a9c5d" stroke-width="1.5"/>
    <circle cx="262" cy="800" r="15" fill="#3a9c5d"/><text x="262" y="805" text-anchor="middle" class="num">6</text>
    <text x="290" y="796" class="step" fill="#3a9c5d">VALIDATE</text>
    <text x="290" y="820" class="head">linkml-validate  +  check_metadata_uniqueness.py</text>
    <text x="290" y="842" class="body">the same two checks GitHub Actions runs</text>
  </g>
  <line x1="480" y1="856" x2="480" y2="888" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output -->
  <g>
    <rect x="330" y="890" width="300" height="60" rx="30" fill="#1b2430"/>
    <text x="480" y="920" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">DMS/ or SHAPE/ rnastruct#####.yaml</text>
    <text x="480" y="940" text-anchor="middle" font-size="13" fill="#9fb0c3">validated ✓</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="230" y="998" width="500" height="132" rx="12" fill="#f7f9fc" stroke="#d3dae4" stroke-width="1.2"/>
    <text x="252" y="1026" font-size="14" font-weight="700" fill="#1b2430">Legend</text>
    <rect x="252" y="1042" width="22" height="14" rx="4" fill="#e8f0fe" stroke="#4a80e0"/>
    <text x="284" y="1054" class="legend">Steps 1–4: scripted, LLM-free — cheap to run in batch over many papers</text>
    <rect x="252" y="1068" width="22" height="14" rx="4" fill="#fff4e0" stroke="#e0952a"/>
    <text x="284" y="1080" class="legend">Step 5: the part needing a human / model — verify biology &amp; map fields</text>
    <rect x="252" y="1094" width="22" height="14" rx="4" fill="#e6f4ea" stroke="#3a9c5d"/>
    <text x="284" y="1106" class="legend">Step 6: automated validation (repo CI checks)</text>
  </g>

  <!-- batch note -->
  <text x="40" y="1160" class="subtitle">Batch mode: find_probing_candidates.py wraps steps 1–3 across all year ranges into one triage table; steps 4–6 run per accepted candidate.</text>
</svg>
