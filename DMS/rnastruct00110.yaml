  # Excluded from this curation:
  # - GSM2771017, GSM2771018 (csp deletion mutants) and GSM2801050 (kasugamycin): unreplicated perturbations.
  # - Ribosome profiling, mRNA-seq and total RNA-seq libraries.
  # - GSM2801051-GSM2801055, GSM2946865-GSM2946871 (DMS-MaPseq of purified cspA mRNA): targeted amplicons.
  run_accessions:
