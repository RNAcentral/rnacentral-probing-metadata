  # multi-site DMS-MaP (msDMS-MaP): an optimised RT reads out N7-G methylation alongside the usual
  # N1-A/N3-C signal, so one DMS experiment reports secondary, tertiary and quaternary structure.
  # ONLY the E. coli rRNA arm is included. GEO states "Amplicon libraries were prepared by 2-step PCR.
  # Ribosomal libaries were prepared via Nextera" - the rRNA samples are therefore randomly fragmented
  # unselected total-RNA libraries, not amplicons, and are kept under the same rule as rnastruct00085.
  # The paper analyses rRNA only, so mRNA coverage will be low.
  # Excluded from GSE285333 (all targeted 2-step-PCR amplicons of one named RNA - fail the scope gate):
  # - 7SK in HEK293T / RPE1 / HeLa, in-cell and cell-free, and the IVT 7SK +/-Larp7 series
  # - U1 / U2 snRNA, human RNase P, Tetrahymena P4-P6, TPP riboswitch ligand titration, E. coli tmRNA
  # - the 16S/23S rRNA amplicon MnCl2 x pH RT-condition titration (method optimisation, not replicates)
  # Also excluded: the cell-free -Mg rRNA pair (GSM9612346/GSM9612349), a single unreplicated
  # refolding condition; and all of GSE285334, which is RNP-MaP protein-crosslinking, not chemical probing.
  run_accessions:
  - accession: GSM9612344
    sample_name: Escherichia_coli_K12_treated_r1
    sample_group: Escherichia_coli_K12
    condition: treated
    replicate: 1
  - accession: GSM9612345
