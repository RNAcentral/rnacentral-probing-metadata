comment: "Paywalled paper (PMC13120737 is in Europe PMC but its fullTextXML is withheld), curated from the GEO record. RT_enzyme inferred as M-MLV: the msDMS-MaP RT is a Mn2+/pH-tuned MaP reverse transcription read out with ShapeMapper2/DanceMapper, and the one GEO sample that used MarathonRT labels it explicitly - confirm against the methods. pH refers to the probing buffer and is not stated for the rRNA samples; the pH values in the excluded amplicon titration are RT conditions."
